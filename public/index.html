<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Food Delivery Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #6a0dad;
      margin: 0;
      padding: 0;
    }

    header {
      background: #4b0082;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    .container {
      padding: 1.5rem;
      max-width: 700px;
      margin: auto;
      color: white;
    }

    .menu-item {
      background: #ffffff;
      color: black;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      color: #666;
    }

    footer a {
      color: #d1b3ff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>🍔 Food Delivery Menu</h1>
    <p id="version">Loading version...</p>
  </header>

  <div class="container" id="menu">
    Loading menu...
  </div>

  <footer>
    <h1>DevOps Food Menu App</h1>
    <p>
      CI/CD Pipeline with AWS, Terraform & ECS
      Built by Jonathan Pollyn<br>
      <a href="https://github.com/JonathanPollyn/Production-Ready-CICD-Pipeline-on-AWS" target="_blank">
        View Project on GitHub
      </a>
    </p>
  </footer>

  <script>
    async function loadMenu() {
      const res = await fetch("/api/menu");
      const data = await res.json();

      const menuDiv = document.getElementById("menu");
      menuDiv.innerHTML = "";

      data.forEach(item => {
        const div = document.createElement("div");
        div.className = "menu-item";
        div.innerHTML = `<strong>${item.name}</strong><span>$${item.price}</span>`;
        menuDiv.appendChild(div);
      });
    }

    async function loadVersion() {
      const res = await fetch("/version");
      const data = await res.json();
      document.getElementById("version").innerText =
        `Version: ${data.version}`;
    }

    loadMenu();
    loadVersion();
  </script>

</body>

</html>
